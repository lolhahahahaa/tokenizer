<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LLM Pipeline Explorer</title>
  <style>
    * { box-sizing: border-box; border-radius: 0 !important; }
    body { margin: 0; font-family: Inter, Helvetica Neue, Arial, sans-serif; background: #FFFFFF; color: #111111; }
    .container { padding: 20px; max-width: 1200px; margin: auto; }
    textarea { width: 100%; height: 80px; border: 1px solid #CCCCCC; resize: vertical; font-family: inherit; }
    button { background: #0055FF; color: #FFFFFF; border: 1px solid #CCCCCC; padding: 8px 16px; cursor: pointer; margin-top: 8px; }
    button:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #CCCCCC; padding: 4px 8px; text-align: left; }
    .token-box { display: inline-block; border: 1px solid #CCCCCC; padding: 4px 6px; margin: 2px; min-width: 30px; text-align: center; }
    .known { background: #E0F2E9; } /* emerald tint */
    .unk { background: #FDE8E8; }   /* red/amber tint */
    #plot { width: 100%; height: 400px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>LLM Pipeline Explorer</h1>

    <!-- Part 1: Tokenizer & Vocabulary -->
    <section>
      <h2>1. Tokenizer & Vocabulary Builder</h2>
      <textarea id="corpus" placeholder="Enter training sentences, one per line...">The cat sat on the mat.
The dog chased the cat.
Birds fly high in the sky.
Fish swim in the clear blue river.
I love reading fascinating books.
The bright sun shines every morning.</textarea>
      <button id="buildVocabBtn">Build Vocabulary</button>
      <div id="vocabInfo"></div>
      <table id="vocabTable" style="display:none;"><thead><tr><th>ID</th><th>Token</th><th>Count</th></tr></thead><tbody></tbody></table>
    </section>

    <section style="margin-top:24px;">
      <h2>Encode a Sentence</h2>
      <input type="text" id="sentenceInput" style="width:100%;border:1px solid #CCCCCC;padding:4px;" placeholder="The cat sat on the wooden chair." />
      <button id="tokenizeBtn">Tokenize</button>
      <p>Note: unknown words are broken into smaller pieces</p>
      <div id="tokensContainer"></div>
    </section>

    <!-- Part 2: Embeddings -->
    <section style="margin-top:24px;">
      <h2>2. Embeddings in 3D</h2>
      <textarea id="sentencesBatch" placeholder="Enter sentences, one per line...">The cat sat on the mat.
A kitten rested on the rug.
The bat sat on the mat.
I love programming in Python.
Coding in Python is my passion.
Pythons are large snakes.
The stock market crashed today.
Share prices fell sharply.</textarea>
      <div style="margin-top:8px;">
        <label><input type="radio" name="embedMode" value="spelling" checked /> Spelling‑based</label>
        <label style="margin-left:12px;"><input type="radio" name="embedMode" value="meaning" /> Meaning‑based</label>
      </div>
      <button id="embedBtn">Embed and plot</button>
      <div id="plot"></div>
    </section>
  </div>

  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
  <script>
    // ---------- Vocabulary Builder ----------
    const vocab = new Map(); // token -> {id, count}
    let nextId = 1; // 0 reserved for [UNK]
    const UNK = {id:0, token:'[UNK]'};

    function buildVocabulary() {
      vocab.clear(); nextId = 1;
      const lines = document.getElementById('corpus').value.split('\n').filter(l=>l.trim());
      for (const line of lines) {
        const words = line.trim().split(/\s+/);
        for (const w of words) {
          const token = w.toLowerCase();
          if (!vocab.has(token)) {
            vocab.set(token, {id: nextId++, count:1});
          } else {
            vocab.get(token).count++;
          }
        }
      }
      // display
      const info = document.getElementById('vocabInfo');
      info.textContent = `Vocabulary size: ${vocab.size + 1} tokens (including [UNK])`;
      const tbody = document.querySelector('#vocabTable tbody');
      tbody.innerHTML = '';
      // add UNK first
      const unkRow = `<tr><td>0</td><td>${UNK.token}</td><td>-</td></tr>`;
      tbody.insertAdjacentHTML('beforeend', unkRow);
      // sort by count desc then token
      const entries = Array.from(vocab.entries()).sort((a,b)=>b[1].count - a[1].count);
      for (const [tok, meta] of entries) {
        tbody.insertAdjacentHTML('beforeend', `<tr><td>${meta.id}</td><td>${tok}</td><td>${meta.count}</td></tr>`);
      }
      document.getElementById('vocabTable').style.display='table';
    }
    document.getElementById('buildVocabBtn').addEventListener('click', buildVocabulary);

    // ---------- Tokenizer ----------
    function tokenizeSentence() {
      const sentence = document.getElementById('sentenceInput').value.trim();
      const container = document.getElementById('tokensContainer');
      container.innerHTML = '';
      if (!sentence) return;
      const words = sentence.split(/\s+/);
      for (const w of words) {
        const low = w.toLowerCase();
        if (vocab.has(low)) {
          const id = vocab.get(low).id;
          const box = document.createElement('div');
          box.className = 'token-box known';
          box.innerHTML = `${w}<br/><small>ID: ${id}</small>`;
          container.appendChild(box);
        } else {
          // unknown: split into chars with ## prefix (first char without ##?) using spec: each char as separate token with ## prefix for continuation
          for (let i=0;i<w.length;i++) {
            const sub = (i===0? w[i] : '##'+w[i]);
            const box = document.createElement('div');
            box.className = 'token-box unk';
            box.innerHTML = `${sub}<br/><small>ID: 0</small>`;
            container.appendChild(box);
          }
        }
      }
    }
    document.getElementById('tokenizeBtn').addEventListener('click', tokenizeSentence);

    // ---------- Simple Embedding & 3D Plot (Three.js) ----------
    function embedAndPlot() {
      const mode = document.querySelector('input[name="embedMode"]:checked').value;
      const lines = document.getElementById('sentencesBatch').value.split('\n').filter(l=>l.trim());
      // generate a dummy 3D vector for each sentence
      const vectors = lines.map((txt,i)=>{
        // spelling mode: use character code sum mod 1000 normalized
        if (mode==='spelling') {
          let sum=0; for (const ch of txt) sum+=ch.charCodeAt(0);
          const angle = (sum % 360) * Math.PI/180;
          return [Math.cos(angle)*0.5, Math.sin(angle)*0.5, (i%2===0?0.3:-0.3)];
        } else {
          // meaning mode: simple pseudo‑semantic based on word categories
          const lower = txt.toLowerCase();
          let x=0,y=0,z=0;
          if (lower.includes('cat')||lower.includes('dog')||lower.includes('bird')||lower.includes('fish')||lower.includes('kitten')||lower.includes('bat')) {x=0.4; y=0.4;}
          if (lower.includes('python')||lower.includes('code')||lower.includes('programming')) {x=-0.4; y=0.4;}
          if (lower.includes('stock')||lower.includes('price')) {x=0; y=-0.4;}
          // add slight variation
          z = (Math.random()-0.5)*0.2;
          return [x,y,z];
        }
      });

      // clear previous plot
      const plotDiv = document.getElementById('plot');
      plotDiv.innerHTML='';
      const width = plotDiv.clientWidth || 600;
      const height = 400;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, width/height, 0.1, 1000);
      camera.position.set(0,0,2);
      const renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(width, height);
      plotDiv.appendChild(renderer.domElement);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      // axes
      const axesHelper = new THREE.AxesHelper(0.6);
      scene.add(axesHelper);
      // points
      vectors.forEach((v,i)=>{
        const geometry = new THREE.SphereGeometry(0.02,16,16);
        const material = new THREE.MeshBasicMaterial({color: 0x0055FF});
        const sphere = new THREE.Mesh(geometry, material);
        sphere.position.set(v[0], v[1], v[2]);
        sphere.userData = {label: lines[i], coords: v};
        scene.add(sphere);
      });
      // tooltip via raycaster
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const tooltip = document.createElement('div');
      tooltip.style.position='absolute'; tooltip.style.padding='4px 8px'; tooltip.style.background='rgba(0,0,0,0.7)'; tooltip.style.color='#fff'; tooltip.style.fontSize='12px'; tooltip.style.pointerEvents='none'; tooltip.style.display='none';
      document.body.appendChild(tooltip);
      function onMouseMove(event){
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = - ((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        if (intersects.length>0 && intersects[0].object.geometry.type==='SphereGeometry') {
          const obj = intersects[0].object;
          tooltip.style.left = (event.clientX+8)+'px';
          tooltip.style.top = (event.clientY+8)+'px';
          const {label,coords}=obj.userData;
          tooltip.innerHTML = `${label}<br/>(${coords.map(c=>c.toFixed(3)).join(', ')})`;
          tooltip.style.display='block';
        } else {
          tooltip.style.display='none';
        }
      }
      renderer.domElement.addEventListener('mousemove', onMouseMove);
      function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
      animate();
    }
    document.getElementById('embedBtn').addEventListener('click', embedAndPlot);
  </script>
</body>
</html>
